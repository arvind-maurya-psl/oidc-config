name: Deploy test to AWS

on:
  push:
    branches: [ main, develop, github-workflow ]

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Context
        run: |
            echo "Repository=${{ github.repository }}"
            echo "Ref=${{ github.ref }}"
            echo "Branch=${{ github.ref_name }}"
            echo "Event=${{ github.event_name }}"
            echo "Actor=${{ github.actor }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify Identity
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install awscli boto3
          pip install -r requirements.txt
      
      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r src/ deployment/
          cp -r infrastructure/ deployment/
          cp requirements.txt deployment/
          cd deployment && zip -r ../agentic-ai-deployment.zip . && cd ..
      
      - name: Upload to S3
        run: |
          aws s3 cp agentic-ai-deployment.zip s3://${{ secrets.DEPLOYMENT_BUCKET }}/agentic-ai-${{ github.sha }}.zip
